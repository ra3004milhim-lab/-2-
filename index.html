<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>لعبة الاولويز</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #1f1b38;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .hud {
      width: 92%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: bold;
    }
    canvas {
      background: #2b264d;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div id="score">النقاط: 0</div>
    <div id="lives">❤️❤️❤️</div>
    <div id="best">الأفضل: 0</div>
  </div>
  <canvas id="game" width="360" height="540"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let best = localStorage.getItem("bestScore") || 0;
    let lives = 3;
    let gameOver = false;

    document.getElementById("best").textContent = "الأفضل: " + best;

    const player = { x: 180, y: 450, size: 28, emoji: "👦🏻" };
    const enemy  = { x: 180, y: 200, size: 32, emoji: "👩🏻", speed: 2.3 };
    const target = { x: 80,  y: 120, size: 28, emoji: "🩲" };

    function movePlayer(clientX, clientY) {
      if (gameOver) return;
      const rect = canvas.getBoundingClientRect();
      player.x = Math.max(25, Math.min(canvas.width - 25, clientX - rect.left));
      player.y = Math.max(25, Math.min(canvas.height - 25, clientY - rect.top));
    }

    canvas.addEventListener("touchmove", e => {
      e.preventDefault();
      movePlayer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener("mousemove", e => {
      if (e.buttons === 1) movePlayer(e.clientX, e.clientY);
    });

    canvas.addEventListener("click", () => {
      if (gameOver) resetGame();
    });

    function spawnTarget() {
      target.x = 40 + Math.random() * (canvas.width - 80);
      target.y = 40 + Math.random() * (canvas.height - 80);
    }

    function resetGame() {
      score = 0;
      lives = 3;
      enemy.speed = 2.3;
      enemy.x = 180;
      enemy.y = 180;
      gameOver = false;
      updateHUD();
    }

    function updateHUD() {
      document.getElementById("score").textContent = "النقاط: " + score;
      document.getElementById("lives").textContent = "❤️".repeat(lives);
      if (score > best) {
        best = score;
        localStorage.setItem("bestScore", best);
        document.getElementById("best").textContent = "الأفضل: " + best;
      }
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function update() {
      if (gameOver) return;

      // تحرك العدو باتجاه اللاعب
      const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
      enemy.x += Math.cos(angle) * enemy.speed;
      enemy.y += Math.sin(angle) * enemy.speed;

      // جمع الهدف (الاولويز)
      if (dist(player, target) < 35) {
        score++;
        enemy.speed += 0.15; // زيادة الصعوبة تدريجياً
        spawnTarget();
        updateHUD();
      }

      // الاصطدام بالعدو
      if (dist(player, enemy) < 34) {
        lives--;
        enemy.x = Math.random() * canvas.width;
        enemy.y = 40;
        updateHUD();
        if (lives <= 0) gameOver = true;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = "34px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(target.emoji, target.x, target.y);
      ctx.fillText(enemy.emoji, enemy.x, enemy.y);
      ctx.fillText(player.emoji, player.x, player.y);

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.65)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 26px sans-serif";
        ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "18px sans-serif";
        ctx.fillText("اضغط لإعادة اللعب", canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
